# Agent settings read by the agent (src/team_assistant/config.py) and by the CDK app
# (infra/team_assistant_infra/stack.py). Unknown keys are an error.

# Bedrock inference profile of the model.
model_id = "global.anthropic.claude-haiku-4-5-20251001-v1:0"
# Upper limit of one answer, in tokens.
max_output_tokens = 4000

[tracing]
# false: the agent exports no spans, metrics or log records through OpenTelemetry. true: its
# spans (ids, timings and token counts, no message content) go to the agent's own CloudWatch
# log group (docs/security.md, "Traces").
enabled = false

[memory]
# Days after which a conversation event is deleted by AgentCore Memory (7 to 365).
event_expiry_days = 30

# Long-term records brought into the prompt, one block per strategy name from NAMESPACES in
# src/team_assistant/config.py. top_k: at most this many records per question (1 to 1000);
# relevance_score: records scoring below it are dropped (0.0 to 1.0). Summaries are stored but
# not retrieved. Values from `make measure`:
# preference records scored 0.32-0.38 whether relevant or not, so their threshold stays low and
# top_k bounds them; relevant facts scored 0.42-0.51, the rest 0.32-0.38, so 0.4 drops the rest.
[memory.retrieval.preferences]
top_k = 5
relevance_score = 0.2

[memory.retrieval.facts]
top_k = 5
relevance_score = 0.4
