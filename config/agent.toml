# Agent settings read by the agent (src/team_assistant/config.py) and by the CDK app
# (infra/team_assistant_infra/stack.py). Unknown keys are an error.

# Bedrock inference profile of the model.
model_id = "global.anthropic.claude-haiku-4-5-20251001-v1:0"
# Upper limit of one answer, in tokens.
max_output_tokens = 4000

[tracing]
# false: the agent exports no spans, metrics or log records through OpenTelemetry. true: its
# spans (ids, timings and token counts, no message content) go to the agent's own CloudWatch
# log group (docs/security.md, "Traces").
enabled = false

[memory]
# Days after which a conversation event is deleted by AgentCore Memory (7 to 365).
event_expiry_days = 30

# How many of the user's newest preference records go into the system prompt of every request
# (0 to 100; 0: none). They are listed, not searched. Facts and summaries of earlier
# conversations are not put into the prompt; the model looks them up with its memory tools
# (src/team_assistant/recall.py).
max_preferences = 20

# The most facts one search_memory call returns (1 to 100; 5 when absent). AgentCore Memory
# returns the facts closest to the query; this is its topK.
facts_top_k = 20

# The most summaries one recall_conversations call returns (1 to 100; 5 when absent).
summaries_top_k = 5
