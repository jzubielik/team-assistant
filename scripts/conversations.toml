# Scripted conversations for make measure (scripts/measure.py). Each runs as one user in a new
# session; then `followup` is asked in another new session, so the answer can only use what
# long-term memory extracted. `followup` is one question or a list of questions asked one after
# the other in that session.

[[conversation]]
name = "preference"
messages = [
    "When you show code, use Python unless I say otherwise.",
    "And keep code examples under ten lines, please.",
]
followup = "Show me how to read a file line by line."

[[conversation]]
name = "fact"
messages = [
    "Our team deploys the billing service from the main branch every Tuesday.",
    "The billing service is written in Go and owned by the payments team.",
]
followup = "Which language is the billing service written in, and when is it deployed?"

[[conversation]]
name = "mixed"
messages = [
    "I'm on call this week for the payments team.",
    "When I'm on call, give me the runbook step first and skip the background.",
]
followup = "The billing service is returning errors. What should I do first?"

# The second question is short: alone it names no property, and the first answer does not
# hold what it asks for. The model has to write the search from the conversation ("Which
# language is the search service written in?"). The billing records come from the
# conversations above.
[[conversation]]
name = "short-followup"
messages = [
    "The search service is written in Rust and owned by the discovery team.",
    "The search service is deployed from the release branch every Thursday.",
]
followup = [
    "Which language is the billing service written in? Answer with the language only.",
    "And the search one?",
]
