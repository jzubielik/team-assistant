# Conversations for make seed (scripts/seed.py): they fill one user's long-term memory, so
# that a search has many records to choose from. Each conversation runs in a new session.
# AgentCore Memory, not this file, decides which records come of them; make seed writes down
# what was stored.
#
# Several services share a language, a team or a deploy day on purpose: a question such as
# "Which services are written in Go?" then has many answers.

# One service per conversation, the same two sentences for each.

