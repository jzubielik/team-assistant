name: ci
on:
  push:
  pull_request:
  # New advisories appear without a commit: make audit runs weekly too.
  schedule:
    - cron: "23 6 * * 1"

# Read-only token; no job writes to the repository.
permissions:
  contents: read
# Third-party actions are pinned to a full commit SHA (a tag can be moved); the comment is the
# release it points to. Update both together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch and its full history, for make leaks
          persist-credentials: false # no later step pushes; keep the token out of .git/config
      # The tool runner image (docker/runner.Dockerfile): the same tools as locally. Its tag
      # hashes the Dockerfile and lock files.
      - name: runner image tag
        id: runner
        run: echo "image=$(make runner-image)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The layer cache (type=gha) is a GitHub service; on another forge remove the two cache
      # lines and the image is built from scratch in every run.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/runner.Dockerfile
          tags: ${{ steps.runner.outputs.image }}
          load: true
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      # gitleaks and trufflehog (verified and unknown results) over every commit of every
      # fetched ref; fails on findings.
      - name: make leaks
        run: make leaks
      # ruff, actionlint, zizmor, hadolint, shellcheck, pytest -m "not integration" and the
      # page's check (types, unit tests, build), in the runner. No AWS call and no AWS credentials in this workflow.
      - name: make check
        run: make check
      # pip-audit of the locked Python dependencies (queries the advisory database).
      - name: make audit
        run: make audit
      # Catch Makefile breakage offline: -n only prints the recipe, nothing is called.
      - name: make -n deploy
        run: make -n deploy ENV=dev PROFILE=ci-placeholder REGION=us-east-1
